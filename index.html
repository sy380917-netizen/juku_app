<!DOCTYPE html>
<!--
==========================================================
  個別指導スクエア 補習管理アプリ
==========================================================
  v1.71 タイムテーブルの表示期間制限対応版
==========================================================
-->
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<title>個別指導スクエア 補習管理</title>
<style>
:root {
  --zoom-ratio: 1.0;
  --slot-base-w: 36px;
  --slot-base-h: 70px;
  --adc-base-size: 34px;

  --slot-w: calc(var(--slot-base-w) * var(--zoom-ratio));
  --slot-h: calc(var(--slot-base-h) * var(--zoom-ratio));
  --adc-size: calc(var(--adc-base-size) * var(--zoom-ratio));
  
  --font-xs: calc(10px * var(--zoom-ratio));
  --font-sm: calc(11px * var(--zoom-ratio));
  --font-md: calc(12px * var(--zoom-ratio));
}
@media (max-width: 768px) {
  :root {
    --slot-base-w: 40px;
    --slot-base-h: 75px;
    --adc-base-size: 38px;
  }
}

*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
html,body{height:100%}
button, .tds, .sc, .spx, .bpsm, .gpsm, .spisms, .cpill, .durbtn { touch-action: manipulation; }

.app-root{display:flex;flex-direction:column;height:100%;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
body{background:#f3f4f6}

/* LOGIN/SETUP */
.cp{min-height:100%;display:flex;align-items:center;justify-content:center;background:#f3f4f6}
.lcard{background:#fff;border-radius:14px;padding:36px;width:340px;text-align:center;box-shadow:0 2px 16px rgba(0,0,0,.1)}
.llogo{font-size:20px;font-weight:700;color:#111827;margin-bottom:4px}
.llogo span{color:#B91C1C}
.lsub{font-size:13px;color:#6b7280;margin-bottom:26px}
.sucard{background:#fff;border-radius:14px;padding:24px;width:360px;max-width:95vw;box-shadow:0 2px 16px rgba(0,0,0,.1);overflow-y:auto;max-height:90vh}
.suuser{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.susec{margin-bottom:14px}
.suseclab{font-size:13px;font-weight:700;color:#111827;margin-bottom:7px}
.supills{display:flex;flex-wrap:wrap;gap:6px}
.spx{padding:7px 14px;border-radius:22px;font-size:13px;font-weight:500;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#374151;white-space:nowrap}
.spx.sa{background:#22C55E;color:#fff;border-color:#22C55E;font-weight:700}
.spx.ba{background:#B91C1C;color:#fff;border-color:#B91C1C;font-weight:700}
.spx.ga{background:#3B82F6;color:#fff;border-color:#3B82F6;font-weight:700}
.suconfirm{width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:600;border:none;background:#e5e7eb;color:#9ca3af;cursor:default;margin-top:4px}
.suconfirm.rdy{background:#22C55E;color:#fff;cursor:pointer}
.btiny{font-size:12px;color:#9ca3af;border:none;background:none;cursor:pointer;width:100%;text-align:center;margin-top:10px;display:block}

/* APP HEADER */
.ahdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fff;border-bottom:1px solid #e5e7eb;overflow-x:auto;scrollbar-width:none}
.ahdr::-webkit-scrollbar{display:none}
.atitle{font-size:13px;font-weight:700;color:#111827;display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.atitle span{color:#B91C1C}
.hdr-camera-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border:1px solid #3B82F6;border-radius:6px;background:#EFF6FF;color:#1E40AF;cursor:pointer;font-weight:600;white-space:nowrap;flex-shrink:0}
.hdr-camera-btn:hover{background:#DBEAFE}
.uchip{display:flex;align-items:center;gap:6px;flex-shrink:0}
.uav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0}
.hdrbtn{font-size:11px;padding:3px 9px;border:1px solid #d1d5db;border-radius:6px;background:none;cursor:pointer;color:#6b7280;white-space:nowrap;flex-shrink:0}

/* SCHEDULE */
.schp{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;position:relative}
.schscr{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dinput{font-size:12px;padding:4px 8px;border:1px solid #d1d5db;border-radius:6px}
.gwrap{width:100%}
table.stbl{width:100%;border-collapse:collapse;table-layout:fixed}
.stbl th{position:sticky;top:0;z-index:10;background:#1F2937;color:#fff;padding:6px 5px;font-size:11px;font-weight:600;text-align:center;border:1px solid #374151;white-space:nowrap}
.stbl th:first-child{left:0;z-index:12}
.stbl th.thT{background:#991B1B}
.stbl td.dyt{vertical-align:top;padding:4px;border:1px solid #e5e7eb;background:#fff;overflow:visible}
.stbl td.dyt.tcol{background:#fffbeb}
.cin{display:flex;flex-direction:column;gap:3px;overflow:visible}

.adc{width:var(--adc-size);height:var(--adc-size);border-radius:50%;background:#22C55E;color:#fff;border:none;cursor:pointer;font-size:calc(var(--adc-size) * 0.6);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 6px rgba(0,0,0,.15);transition:transform 0.1s}
.adc:active{transform:scale(0.9)}
.adc:hover{background:#16A34A}

.sc{border-radius:8px;padding:calc(6px * var(--zoom-ratio)) calc(8px * var(--zoom-ratio));font-size:var(--font-md);color:#fff;line-height:1.35;position:relative;cursor:pointer;transition:filter .12s;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sc:active{transform:scale(0.98)}
.sc:hover{filter:brightness(1.12)}
.sc .sct{font-weight:600;font-size:var(--font-md);white-space:nowrap}
.sc .scd{margin-top:calc(2px * var(--zoom-ratio));font-size:var(--font-sm);opacity:.92;word-break:break-all;padding-right:calc(20px * var(--zoom-ratio))}

.delbtn{position:absolute;top:50%;right:6px;transform:translateY(-50%);background:rgba(0,0,0,.35);border:none;color:#fff;width:calc(22px * var(--zoom-ratio));height:calc(22px * var(--zoom-ratio));border-radius:50%;cursor:pointer;font-size:var(--font-md);line-height:calc(22px * var(--zoom-ratio));text-align:center;padding:0;z-index:2;touch-action:manipulation;flex-shrink:0}
.delbtn:hover{background:rgba(0,0,0,.55)}

/* FORM VIEW */
.fpage{height:100%;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;background:#fff}
.ffixed{flex-shrink:0;background:#fff;border-bottom:1px solid #e5e7eb}
.frow{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid #f3f4f6}
.hpills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding-bottom:2px}
.hpills::-webkit-scrollbar{display:none}
.flab{font-size:11px;color:#6b7280;white-space:nowrap;flex-shrink:0;min-width:28px}
.ubar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f9fafb;border-top:1.5px solid #e5e7eb;min-height:50px}
.ubhint{font-size:13px;color:#9ca3af;flex:1}
.ubsave{padding:10px 20px;border:none;border-radius:8px;background:#22C55E;color:#fff;cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 3px 8px rgba(34,197,94,.35);flex-shrink:0}
.ubsave:hover{background:#16A34A}
.durbtn{padding:8px 14px;border-radius:8px;font-size:13px;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#374151;font-weight:600}
.durbtn:hover{border-color:#3B82F6;background:#EFF6FF;color:#1E40AF}
.fscr{background:#fff;position:relative}
.fbody{padding:12px 0}
.tinp{width:100%;font-size:14px;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
.fhrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f3f4f6}
.bbtn{font-size:13px;padding:5px 12px;border:1px solid #d1d5db;border-radius:6px;background:none;cursor:pointer;color:#6b7280;white-space:nowrap}
.kjval{font-size:15px;font-weight:700;color:#B91C1C;white-space:nowrap;flex:1}
.spisms{padding:6px 12px;border-radius:20px;font-size:13px;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#374151;font-weight:600;white-space:nowrap;flex-shrink:0}
.spisms.act{background:#22C55E;color:#fff;border-color:#22C55E}
.gpsm{padding:6px 12px;border-radius:20px;font-size:13px;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#111827;font-weight:600;white-space:nowrap;flex-shrink:0}
.gpsm.act{border-color:#3B82F6;background:#EFF6FF;color:#1E40AF}
.bpsm{padding:6px 12px;border-radius:20px;font-size:13px;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#374151;font-weight:600;white-space:nowrap;flex-shrink:0}
.bpsm.act{background:#B91C1C;color:#fff;border-color:#B91C1C}

/* タイムグリッド固定（Sticky）＆連動用 */
.tgsh{position:sticky;top:0;z-index:10;flex-shrink:0;display:flex;align-items:stretch;background:#f9fafb;border:1px solid #e5e7eb;border-bottom:none;border-radius:8px 8px 0 0;margin:0 12px}
.tgcorner{width:46px;min-width:46px;flex-shrink:0;border-right:1px solid #d1d5db;background:#f9fafb;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9ca3af;padding:0 2px;position:sticky;left:0;z-index:11}
.tghc{flex:1;overflow:hidden}
.tght{border-collapse:collapse;table-layout:fixed}
.thhour{font-size:var(--font-md);font-weight:700;color:#374151;padding:calc(4px * var(--zoom-ratio));text-align:left;border-right:1px solid #d1d5db;border-bottom:1px solid #e5e7eb;white-space:nowrap}
.th10{font-size:var(--font-xs);color:#c4c9d4;padding:2px 0;text-align:center;border-right:1px solid #f0f0f0;border-bottom:1px solid #e5e7eb;width:var(--slot-w);min-width:var(--slot-w)}
.th10.h30{color:#6b7280;font-weight:700;font-size:var(--font-sm);border-left:1.5px solid #d1d5db}
.th10.h00{border-left:1.5px solid #d1d5db}
.tgwrap{flex:1;min-height:0;overflow-x:auto;overflow-y:auto;border:1px solid #e5e7eb;border-top:none;border-radius:0 0 8px 8px;-webkit-overflow-scrolling:touch;margin:0 12px; padding-bottom: 50vh; }
.tgbody{border-collapse:collapse}

/* タイムテーブルの日付セル */
.tdd{font-size:11px;padding:4px 2px;text-align:center;background:#f9fafb;border-right:1px solid #d1d5db;border-top:1px solid #e5e7eb;vertical-align:middle;white-space:nowrap;width:46px;min-width:46px;line-height:1.3;position:sticky;left:0;z-index:5}
.tds{width:var(--slot-w);min-width:var(--slot-w);max-width:var(--slot-w);min-height:var(--slot-h);height:auto;border-top:1px solid #e5e7eb;border-right:1px solid #e5e7eb;cursor:pointer;transition:background .06s}
.tds.hst{border-left:1.5px solid #d1d5db}
.tds.h30s{border-left:1px solid #cbd5e1}
.tds.prow{background:#FFF5F5}
.tds.prow:hover{background:#FECDD3}
.tds:not(.prow):hover{background:#DBEAFE}

.selbar{background:#2563EB;border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;overflow:hidden;gap:calc(2px * var(--zoom-ratio));box-shadow:0 3px 10px rgba(37,99,235,.35)}
.sbi{color:#fff;font-size:var(--font-md);font-weight:700;line-height:1.3;text-align:left}
.sbt{color:rgba(255,255,255,.9);font-size:var(--font-xs);white-space:nowrap;line-height:1.2}
.exm{padding:4px 6px;border-top:1px solid #e5e7eb;border-right:1px solid rgba(0,0,0,.06);background:transparent;vertical-align:top}

/* 確認パネル */
.cpanel{background:#fff;border:2px solid #22C55E;border-radius:12px;margin:8px 12px;padding:12px 14px;box-shadow:0 4px 16px rgba(34,197,94,.15);display:flex;flex-direction:column}
.cpanel.em{border-color:#F59E0B;box-shadow:0 4px 16px rgba(245,158,11,.15)}
.cptitle{font-size:14px;font-weight:700;color:#111827;margin-bottom:6px;text-align:center}
.cprow{display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:0.5px solid #f3f4f6}
.cprow:last-of-type{border-bottom:none}
.cplab{font-size:11px;color:#6b7280;width:40px;flex-shrink:0;padding-top:4px;font-weight:600}
.cppills{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.cpill{padding:4px 10px;border-radius:20px;font-size:11px;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#374151;font-weight:600}
.cpill.act{background:#22C55E;color:#fff;border-color:#22C55E;font-weight:700}
.cetbtn{margin-top:2px;font-size:11px;color:#3B82F6;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;display:block}
.cpok{flex:1;padding:10px;border:none;border-radius:8px;background:#22C55E;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.cpok:hover{background:#16A34A}
.cpcancel{flex:1;padding:10px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;color:#6b7280;font-size:14px;font-weight:600;cursor:pointer}
.cpcancel:hover{background:#f9fafb}

.sch-sticky{position:sticky;top:0;z-index:9;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sch-hdr-row{display:flex;background:#1F2937}
.sch-corner{flex-shrink:0;background:#1F2937;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;border-right:1px solid #374151;padding:6px 4px}
.sch-hdr-clip{flex:1;overflow:hidden}
.sch-ht{border-collapse:collapse;table-layout:fixed}
.sch-th{width:88px;min-width:88px;padding:6px 4px;text-align:center;border-right:1px solid #374151;background:#1F2937;color:#fff;vertical-align:middle}
.sch-th.tod{background:#991B1B}
.sch-date{font-size:13px;font-weight:700;line-height:1.2;display:block}
.sch-dow{font-size:11px;font-weight:400;opacity:.8;display:block;margin-top:2px}
.brn{background:#B91C1C;color:#fff;font-size:16px;font-weight:700;padding:6px 4px;text-align:center;border:1px solid #991B1B;width:70px;min-width:70px;position:sticky;left:0;z-index:2;height:60px;vertical-align:middle}
.sch-th-sel{background:#7F1D1D !important}
.sch-th-sel .sch-date,.sch-th-sel .sch-dow{color:#fff}
.del-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.del-modal{background:#fff;border-radius:14px;padding:22px 20px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.del-modal-title{font-size:15px;font-weight:700;color:#111827;margin-bottom:10px;text-align:center}
.del-modal-info{background:#f9fafb;border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:13px;color:#374151;line-height:1.6}
.del-modal-btns{display:flex;gap:8px}
.del-modal-ok{flex:1;padding:12px;border:none;border-radius:10px;background:#DC2626;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.del-modal-ok:hover{background:#B91C1C}
.del-modal-cancel{flex:1;padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#6b7280;font-size:14px;font-weight:600;cursor:pointer}
.del-modal-cancel:hover{background:#f9fafb}
.undo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;border-radius:10px;padding:12px 18px;display:flex;align-items:center;gap:16px;font-size:14px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap}
.undo-btn{padding:6px 14px;border:1.5px solid #fff;border-radius:6px;background:none;color:#fff;cursor:pointer;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="app-root" id="app"></div>
<div id="sc-tooltip" style="display:none;position:fixed;background:#1F2937;color:#fff;padding:10px 13px;border-radius:10px;font-size:12px;line-height:1.8;z-index:9999;pointer-events:auto"></div>
<script>
try {
  var testCheck = localStorage.getItem('sq_s');
  if (testCheck === null) {
    localStorage.setItem('sq_s', '[]');
  }
} catch(e) {
  try { localStorage.clear(); } catch(err) {}
}

var BR=['川内校','鳴門校','藍住校','松茂校','石井校','北島校','南部校','勝瑞校'];
var SBJ=['数学','英語','国語','理科','社会','算数','物理','化学'];
var GRADES=['小','中1','中2','中3','高1','高2','高3'];
var SCOLD={数学:'#EA580C',算数:'#EA580C',英語:'#0D9488',国語:'#BE123C',理科:'#0369A1',物理:'#0369A1',化学:'#0369A1',社会:'#7E22CE'};
var DY=['日','月','火','水','木','金','土'];
var TS0=480,TSD=10,TSN=90;
function getDurs(gr){if(!gr)return[50,80,90,120];if(gr==='小')return[50];if(gr[0]==='中')return[80];if(gr[0]==='高')return[90,120];return[50,80,90,120];}
var ACCOUNTS=[
  {id:1,name:'宮川 博',email:'miyakawa.hiroshi@gmail.com',color:'#3B82F6'},
  {id:2,name:'山下',email:'yamashita@gmail.com',color:'#10B981'},
  {id:3,name:'三好',email:'miyoshi@gmail.com',color:'#7C3AED'},
  {id:4,name:'田中',email:'tanaka@gmail.com',color:'#D97706'},
  {id:5,name:'佐藤',email:'sato@gmail.com',color:'#0891B2'},
  {id:6,name:'山本',email:'yamamoto@gmail.com',color:'#059669'},
  {id:7,name:'井上',email:'inoue@gmail.com',color:'#DC2626'},
  {id:8,name:'渡辺',email:'watanabe@gmail.com',color:'#6B7280'}
];
function canEdit(ins){return cu&&cu.name===ins;}

var savedS = localStorage.getItem('sq_s');
var S = savedS ? JSON.parse(savedS) : [];
var nid = S.length > 0 ? Math.max.apply(null, S.map(function(x){return x.id;})) + 1 : 1;
var savedSubj = localStorage.getItem('sq_asubj');
var aSubj = savedSubj ? JSON.parse(savedSubj) : {};
var savedBr = localStorage.getItem('sq_abr');
var aBr = savedBr ? JSON.parse(savedBr) : {};
var savedGr = localStorage.getItem('sq_agr');
var aGr = savedGr ? JSON.parse(savedGr) : {};

function saveToLocalStorage(){
  localStorage.setItem('sq_s', JSON.stringify(S));
  localStorage.setItem('sq_asubj', JSON.stringify(aSubj));
  localStorage.setItem('sq_abr', JSON.stringify(aBr));
  localStorage.setItem('sq_agr', JSON.stringify(aGr));
}

var suSubj=[],suBr=[],suGr=[];
var _today=new Date();
try {
  _today.setDate(_today.getDate()-_today.getDay());
} catch(e) {
  _today = new Date();
}
var regName='',regEmail='',regColor='#3B82F6',regErrMsg='';
var APP_VERSION='v1.71';
var cu=null,showPick=false,loginEmail='',wk=_today,view='sch';
var fBrList=[],fDate=null,fSj=null,fGr=null,fStu='',fIns='',fNote='';
var tR=null,tS=null,dur=null,editId=null,cfOpen=false,savedCount=0;
var _skipAutoScroll=false;
var _schFirstLoad=true;
var _customDur=false;
var schFBr=[],schFDt=[],schFIns=[],schPickerOpen=false;
var delConfId=null,delAccId=null;
var undoPrevS=null,undoMsg='',undoTimer=null;
var schNavOpen=false,schBrOpen=false,schInsOpen=false;
var calOpen=false,calY=new Date().getFullYear(),calM=new Date().getMonth();

function fd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function isTd(d){return fd(d)===fd(new Date())}

// ▼ 月曜から土曜（または指定の1週間内での月〜土）に限定して返すよう調整 ▼
function wkd(){
  var r=[];
  var d = new Date(wk);
  //
