<style>

<script>
// ▼▼▼ スマホ専用のピンチズーム・エンジン ▼▼▼
var appZoom = 1;
var lastPinchDist = null;

window.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
        lastPinchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
    }
}, { passive: false });

window.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2 && lastPinchDist !== null) {
        e.preventDefault(); // ブラウザ標準の挙動をブロックし、専用ズームを適用
        var dist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
        );
        var delta = dist / lastPinchDist;
        appZoom *= delta;
        // ズームの限界値（0.4=40%縮小全体表示 ～ 1.5=150%拡大）
        appZoom = Math.max(0.4, Math.min(appZoom, 1.5));
        document.documentElement.style.setProperty('--app-zoom', appZoom);
        lastPinchDist = dist;
    }
}, { passive: false });

window.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) {
        lastPinchDist = null;
    }
});
// ▲▲▲ 専用ピンチズーム・エンジンここまで ▲▲▲

var BR=['川内校','鳴門校','藍住校','松茂校','石井校','北島校','南部校','勝瑞校'];

var ACCOUNTS=[
  {id:1,name:'宮川 博',email:'miyakawa.hiroshi@gmail.com',color:'#3B82F6'},

  {id:3,name:'三好',email:'miyoshi@gmail.com',color:'#7C3AED'},
  {id:4,name:'田中',email:'tanaka@gmail.com',color:'#D97706'},
  {id:5,name:'佐藤',email:'sato@gmail.com',color:'#0891B2'},
  {id:6,name:'山本',email:'yamamoto@gmail.com',color:'#059669'},
  {id:7,name:'井上',email:'inoue@gmail.com',color:'#DC2626'},
  {id:8,name:'渡辺',email:'watanabe@gmail.com',color:'#6B7280'}
];
function canEdit(ins){return cu&&cu.name===ins;}

var S = savedS ? JSON.parse(savedS) : [];
var nid = S.length > 0 ? Math.max.apply(null, S.map(function(x){return x.id;})) + 1 : 1;

function saveToLocalStorage(){
  localStorage.setItem('sq_s', JSON.stringify(S));
  localStorage.setItem('sq_asubj', JSON.stringify(aSubj));
  localStorage.setItem('sq_abr', JSON.stringify(aBr));
  localStorage.setItem('sq_agr', JSON.stringify(aGr));
}

var suSubj=[],suBr=[],suGr=[];
var _today=new Date();_today.setDate(_today.getDate()-_today.getDay());
var regName='',regEmail='',regColor='#3B82F6',regErrMsg='';
var APP_VERSION='v1.36';
var cu=null,showPick=false,loginEmail='',wk=_today,view='sch';
var fBrList=[],fDate=null,fSj=null,fGr=null,fStu='',fIns='',fNote='';
var tR=null,tS=null,dur=null,editId=null,cfOpen=false,savedCount=0;
var _skipAutoScroll=false;
var _schFirstLoad=true;
var _customDur=false;

function fd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function isTd(d){return fd(d)===fd(new Date())}
function wkd(){var r=[];for(var i=0;i<7;i++){var d=new Date(wk);d.setDate(d.getDate()+i);r.push(d)}return r}
function m2s(m){return('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2)}
function sl2m(i){return TS0+i*TSD}
function av(n){return n.replace(/\s/g,'').slice(0,2)}
function t2sl(t){var p=t.split(':');return(parseInt(p[0])*60+parseInt(p[1])-TS0)/TSD}

function mySbj(){return cu&&aSubj[cu.id]?aSubj[cu.id]:SBJ}

window.loginWithEmail=function(){
  var email=(loginEmail||'').trim().toLowerCase();
  if(!email){alert('Gmailアドレスを入力してください');return;}
  var acct=ACCOUNTS.find(function(a){return a.email.toLowerCase()===email;});
  if(acct){cu=acct;fIns=cu.name;if(!aSubj[cu.id]){suSubj=[];suBr=[];suGr=[];view='setup';}else view='sch';R();}
  else{regName='';regEmail=email;regColor='#3B82F6';view='register';R();}
};
window.openRegister=function(){regName='';regEmail='';regColor='#3B82F6';regErrMsg='';view='register';R();};
window.cancelRegister=function(){view=cu?'sch':'login';showPick=false;R();};
window.confirmRegister=function(){
  var n=regName.trim(),e=(regEmail||'').trim().toLowerCase();
  if(!e||!n){regErrMsg='必要項目を入力してください';R();return;}
  var newId=Math.max.apply(null,ACCOUNTS.map(function(a){return a.id;}))+1;
  ACCOUNTS.push({id:newId,name:n,email:e,color:'#3B82F6'});
  cu=ACCOUNTS[ACCOUNTS.length-1];fIns=cu.name;suSubj=[];suBr=[];suGr=[];view='setup';R();
};

  delConfId=id;
  R();
};
window.delConfOk=function(){
  if(delConfId===null)return;
  var target=S.find(function(x){return x.id===delConfId;});
  if(target){
    undoPrevS=target;
    undoMsg=target.br+' '+target.s+'〜'+target.e+' '+target.sj+' を削除しました';
  }
  S=S.filter(function(x){return x.id!==delConfId;});
  saveToLocalStorage();
  delConfId=null;
  R();
  if(undoTimer)clearTimeout(undoTimer);
  undoTimer=setTimeout(function(){undoPrevS=null;undoMsg='';R();},6000);
};
window.delConfCancel=function(){delConfId=null;R();};
window.undoDel=function(){
  if(undoPrevS){
    S.push(undoPrevS);
    saveToLocalStorage();
    undoPrevS=null;
    undoMsg='';
    if(undoTimer)clearTimeout(undoTimer);
    R();
  }
};

window.doSave=function(){
  var sT=m2s(sl2m(tS)),eT=m2s(sl2m(tS)+dur);
  if(editId!==null){
    var br1=fBrList[0]||'';
    S=S.map(function(s){return s.id===editId?{id:s.id,br:br1,sj:fSj,gr:fGr,ins:fIns,stu:fStu,note:fNote,dt:tR,s:sT,e:eT}:s;});
    savedCount++;editId=null;
    view='sch';
  }else{
    fBrList.forEach(function(br){S.push({id:nid++,br:br,sj:fSj,gr:fGr,ins:fIns,stu:fStu,note:fNote,dt:tR,s:sT,e:eT});});
    savedCount+=(fBrList.length||1);
    cfOpen=false;tR=null;tS=null;dur=null;fStu='';fNote='';_customDur=false;
  }
  saveToLocalStorage();
  R();
};

  var dates=wkd();

function rForm(){
  var dates=wkd(),isEdit=editId!==null,ms=mySbj(),mb=myBr(),mg=myGr();
  var bpills=mb.map(function(b){return'<button class="bpsm '+(fBrList.indexOf(b)>=0?'act':'')+'" onclick="sBr(\''+b+'\')">'+b+'</button>';}).join('');
  var gpills=mg.map(function(g){return'<button class="gpsm '+(fGr===g?'act':'')+'" onclick="sGr(\''+g+'\')">'+g+'</button>';}).join('');
  var spills=ms.map(function(s){return'<button class="spisms '+(fSj===s?'act':'')+'" onclick="sSj(\''+s+'\')">'+s+'</button>';}).join('');

  var hrHdr='';for(var h=8;h<=23;h++){hrHdr+='<th class="thhour" colspan="6">'+h+':00</th>';}
  var subHdr='';for(var j=0;j<TSN;j++){
    var mm=sl2m(j)%60,cls='th10'+(mm===30?' h30':mm===0?' h00':'');
    subHdr+='<th class="'+cls+'"></th>';
  }

  var tgRowsStr = dates.map(function(d) {
    var dt = fd(d), isPre = (dt === fDate);
    var cells = '', i = 0;

    var items = [];
    if (tR === dt && dur && tS !== null) {
      items.push({ type: 'pre', s: tS, e: tS + (dur / TSD), len: dur / TSD });
    }
    var daySs = S.filter(function(x) { return x.dt === dt; });
    daySs.forEach(function(x) {
      var ss = t2sl(x.s);
      var ee = ss + (t2m(x.e) - t2m(x.s)) / TSD;
      items.push({ type: 'ex', s: ss, e: ee, len: ee - ss, orig: x });
    });

    items.sort(function(a, b) { return a.s - b.s; });
    var groups = [];
    var cur = null;
    items.forEach(function(it) {
      if (!cur) {
        cur = { s: it.s, e: it.e, items: [it] };
        groups.push(cur);
      } else {
        if (it.s <= cur.e) {
          cur.e = Math.max(cur.e, it.e);
          cur.items.push(it);
        } else {
          cur = { s: it.s, e: it.e, items: [it] };
          groups.push(cur);
        }
      }
    });

    var gIdx = 0;
    while (i < TSN) {
      if (gIdx < groups.length && i === groups[gIdx].s) {
        var g = groups[gIdx];
        var glen = g.e - g.s;

        var bgHtml = '<div style="position:absolute; top:0; left:0; right:0; bottom:0; display:flex; z-index:1;">';
        for (var slot = 0; slot < glen; slot++) {
          var actualSlot = g.s + slot;
          var mm = sl2m(actualSlot) % 60;
          var cls = 'tds';
          if (mm === 0) cls += ' hst';
          else if (mm === 30) cls += ' h30s';
          if (isPre) cls += ' prow';
          bgHtml += '<div class="'+cls+'" style="flex:1; height:100%; border-top:1px solid #e5e7eb;" onclick="clickSlot(\''+dt+'\','+actualSlot+')"></div>';
        }
        bgHtml += '</div>';

        var stackHtml = '<div style="position:relative; z-index:2; width:100%; padding-top:6px; pointer-events:none;">';
        stackHtml += '<div style="padding: 0 6px; margin-bottom: 6px;">'
                   + '<button class="adc" style="pointer-events:auto;" onclick="clickSlot(\''+dt+'\','+g.s+');event.stopPropagation();">+</button>'
                   + '</div>';

        g.items.forEach(function(it) {
          var pctLeft = ((it.s - g.s) / glen) * 100;
          var pctWidth = (it.len / glen) * 100;
          var blockStyle = 'margin-left:'+pctLeft+'%; width:'+pctWidth+'%; position:relative; pointer-events:auto; margin-bottom:6px; padding:0 2px;';

          if (it.type === 'pre') {
            var selLabel = (fBrList.join('・')||'') + ' ' + (fGr||'') + ' ' + (fSj||'');
            stackHtml += '<div style="'+blockStyle+'">'
                       + '<div class="selbar" style="height:auto; padding:8px 10px; align-items:flex-start;">'
                       + '<div class="sbi" style="white-space:normal; text-align:left;">'+selLabel+'</div>'
                       + '<div class="sbt">'+m2s(sl2m(it.s))+'〜'+m2s(sl2m(it.e))+'</div>'
                       + '</div></div>';
          } else {
            var s = it.orig;
            var scCol = SCOLD[s.sj] || '#6B7280';
            var isEd = canEdit(s.ins);
            stackHtml += '<div style="'+blockStyle+'">'
                       + '<div class="sc" style="background:'+scCol+';" onclick="showTipModal('+s.id+',event)">'
                       + (isEd?'<button class="delbtn" onclick="delS('+s.id+',event)">×</button>':'')
                       + '<div class="sct">'+s.br+' '+s.sj+' '+s.gr+' '+s.ins+'</div>'
                       + '<div class="scd">'+s.s+'〜'+s.e+'</div>'
                       + '</div></div>';
          }
        });
        stackHtml += '</div>';

        cells += '<td colspan="'+glen+'" style="padding:0; position:relative; vertical-align:top; border:none; background:transparent;">'
               + bgHtml + stackHtml + '</td>';
        
        i += glen;
        gIdx++;
      } else {
        var mm = sl2m(i) % 60;
        var cls = 'tds';
        if (mm === 0) cls += ' hst';
        else if (mm === 30) cls += ' h30s';
        if (isPre) cls += ' prow';
        cells += '<td class="'+cls+'" onclick="clickSlot(\''+dt+'\','+i+')"></td>';
        i++;
      }
    }
    return '<tr data-dt="'+dt+'"><td class="tdd">'+(d.getMonth()+1)+'/'+d.getDate()+'</td>'+cells+'</tr>';
  }).join('');

  var cfPanel='';
  if(cfOpen&&tR&&tS!==null&&dur&&fSj&&fGr){
    var bpillsC=mb.map(function(b){return'<button class="cpill '+(fBrList.indexOf(b)>=0?'act':'')+'" onclick="cBr(\''+b+'\')">'+b+'</button>';}).join('');
    var spillsC=ms.map(function(s){return'<button class="cpill '+(fSj===s?'act':'')+'" onclick="cSj(\''+s+'\')">'+s+'</button>';}).join('');
    var gpillsC=mg.map(function(g){return'<button class="cpill '+(fGr===g?'act':'')+'" onclick="cGr(\''+g+'\')">'+g+'</button>';}).join('');

    cfPanel='<div class="cpanel"><div style="padding:18px"><div class="cptitle">内容確認</div>'
      +'<div class="cprow"><div class="cplab">日時</div><div style="font-size:14px;font-weight:700;color:#1E40AF;padding-top:4px">'+tR+' '+m2s(sl2m(tS))+'〜'+m2s(sl2m(tS)+dur)+'</div><button class="cetbtn" onclick="editTime()">時間変更</button></div>'
      +'<div class="cprow"><div class="cplab">校舎</div><div class="cppills">'+bpillsC+'</div></div>'
      +'<div class="cprow"><div class="cplab">教科</div><div class="cppills">'+spillsC+'</div></div>'
      +'<div class="cprow"><div class="cplab">学年</div><div class="cppills">'+gpillsC+'</div></div>'
      +'<div style="margin-top:12px"><input class="tinp" type="text" placeholder="生徒名 (任意)" value="'+fStu+'" oninput="fStu=this.value"></div>'
      +'<div style="margin-top:10px"><input class="tinp" type="text" placeholder="備考欄 (任意)" value="'+fNote+'" oninput="fNote=this.value"></div>'
      +'<div style="display:flex;gap:10px;margin-top:16px"><button class="cpcancel" onclick="cancelCf()">キャンセル</button><button class="cpok" onclick="doSave()">登録する</button></div>'
      +'</div></div>';
  }

  var delModalStr='';
  if(delConfId!==null){
    var targetS=S.find(function(x){return x.id===delConfId;});
    if(targetS){
      delModalStr='<div class="del-modal-overlay"><div class="del-modal">'
        +'<div class="del-modal-title">🗑️ 予定を削除しますか？</div>'
        +'<div class="del-modal-info"><b>'+targetS.br+'</b> '+targetS.dt+' '+targetS.s+'〜'+targetS.e+'<br>'+targetS.gr+' '+targetS.sj+(targetS.stu?'<br>生徒: '+targetS.stu:'')+'</div>'
        +'<div class="del-modal-btns"><button class="del-modal-cancel" onclick="delConfCancel()">キャンセル</button><button class="del-modal-ok" onclick="delConfOk()">削除する</button></div>'
        +'</div></div>';
    }
  }

  var undoToastStr='';
  if(undoMsg){
    undoToastStr='<div class="undo-toast"><span>'+undoMsg+'</span><button class="undo-btn" onclick="undoDel()">元に戻す</button></div>';
  }

  setTimeout(function(){
    var wrap = document.getElementById('tgW');
    var hc = document.getElementById('tgHC');
    if(wrap && hc && !wrap._scrollLinked){
      wrap._scrollLinked = true;
      wrap.onscroll = function(){
        hc.scrollLeft = wrap.scrollLeft;
      };
    }
  }, 50);

  return'<div class="fpage">'+rAH(true)
    +'<div class="ffixed">'
    +'<div class="fhrow"><button class="bbtn" onclick="gBack()">← 戻る</button><span class="kjval">'+fBrList.join('・')+'</span></div>'
    +'<div class="frow"><span class="flab">校舎</span><div class="hpills">'+bpills+'</div></div>'
    +'<div class="frow"><span class="flab">教科</span><div class="hpills">'+spills+'</div></div>'
    +'<div class="frow"><span class="flab">学年</span><div class="hpills">'+gpills+'</div></div>'
    +'<div style="padding:8px 12px;display:flex;gap:8px">'
    +[50,80,90,120].map(function(m){return'<button class="durbtn" onclick="applyCustomDur('+m+')">'+m+'分</button>';}).join('')
    +'</div>'
    +'<div class="ubar"><span class="ubhint">'+(tR&&tS!==null&&dur?'時間設定完了':'時間枠をタップしてください')+'</span>'+(tR&&tS!==null&&dur?'<button class="ubsave" onclick="saveF()">確認画面へ</button>':'')+'</div>'
    +cfPanel
    +'</div>'
    +'<div class="fscr"><div class="fbody zoom-target">'
    +'<div class="tgsh"><div class="tgcorner">時間</div><div class="tghc" id="tgHC"><table class="tght"><tr>'+hrHdr+'</tr><tr>'+subHdr+'</tr></table></div></div>'
    +'<div class="tgwrap" id="tgW"><table class="tgbody"><tbody>'+tgRowsStr+'</tbody></table></div>'
    +'</div></div>'+delModalStr+undoToastStr+'</div>';
}

// 予定詳細ポップアップ
window.showTipModal=function(id,ev){
  if(ev)ev.stopPropagation();
  var s=S.find(function(x){return x.id===id;});if(!s)return;
  var old=document.getElementById('sc-tip-modal');if(old)old.remove();

  var isOwner = canEdit(s.ins);

  var modal=document.createElement('div');modal.id='sc-tip-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10002;display:flex;align-items:center;justify-content:center;padding:16px';
  modal.innerHTML='<div style="background:#1F2937;color:#fff;padding:20px;border-radius:14px;width:280px;font-size:14px;line-height:1.6">'
    +'<b style="font-size:16px">'+s.br+'</b><br>'+s.gr+' '+s.sj+'<br>'+s.s+'〜'+s.e+'<br>生徒: '+(s.stu||'なし')+'<br>担当: '+s.ins
    +(s.note?'<br>備考: '+s.note:'')
    +(isOwner ? '<div style="display:flex;gap:10px;margin-top:16px">'
      +'<button id="tipEditBtn" style="flex:1;padding:10px;background:#22C55E;border:none;color:#fff;border-radius:8px;cursor:pointer;font-weight:700">編集</button>'
      +'<button id="tipDelBtn" style="flex:1;padding:10px;background:#DC2626;border:none;color:#fff;border-radius:8px;cursor:pointer;font-weight:700">削除</button>'
      +'</div>' : '<div style="margin-top:12px;font-size:12px;color:#9ca3af;text-align:center">※閲覧専用（編集・削除は担当者のみ可能）</div>')
    +'<button id="tipCloseBtn" style="margin-top:10px;width:100%;padding:10px;background:#4B5563;border:none;color:#fff;border-radius:8px;cursor:pointer;font-weight:600">閉じる</button>'
    +'</div>';
  document.body.appendChild(modal);

  if(isOwner){
    document.getElementById('tipEditBtn').onclick = function(){
      modal.remove();
      editSession(id);
    };
    document.getElementById('tipDelBtn').onclick = function(){
      modal.remove();
      delConfId = id;
      R();
    };
  }
  document.getElementById('tipCloseBtn').onclick = function(){
    modal.remove();
  };
};

function R(){
  var main=!cu?rLogin():view==='setup'?rSuCard(false):view==='settings'?rSuCard(true):view==='register'?rRegister():view==='sch'?rSch():rForm();
  document.getElementById('app').innerHTML=main;
}
R();
</script>
