<!DOCTYPE html>
<!--
==========================================================
  個別指導スクエア 補習管理アプリ
==========================================================
  v1.19 プラスボタン・予定入力対応版
==========================================================
-->
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>個別指導スクエア 補習管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
html,body{height:100%}.app-root{display:flex;flex-direction:column;height:100%;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
body{background:#f3f4f6}
.ahdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fff;border-bottom:1px solid #e5e7eb}
.atitle{font-size:13px;font-weight:700;color:#111827;display:flex;align-items:center;gap:8px}
.atitle span{color:#B91C1C}
.uchip{display:flex;align-items:center;gap:6px}
.uav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff}
.schp{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.schscr{flex:1;min-height:0;overflow-y:auto}
.gwrap{width:100%}
table.stbl{width:100%;border-collapse:collapse;table-layout:fixed}
.stbl th{background:#1F2937;color:#fff;padding:6px 5px;font-size:11px;font-weight:600;text-align:center;border:1px solid #374151;white-space:nowrap}
.stbl td.dyt{vertical-align:top;padding:4px;border:1px solid #e5e7eb;background:#fff}
.cin{display:flex;flex-direction:column;gap:3px}
.adc{width:22px;height:22px;border-radius:50%;background:#22C55E;color:#fff;border:none;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.brn{background:#B91C1C;color:#fff;font-size:16px;font-weight:700;padding:6px 4px;text-align:center;border:1px solid #991B1B;width:70px;min-width:70px;position:sticky;left:0;z-index:2;height:60px;vertical-align:middle}
.sch-th{width:88px;min-width:88px;padding:6px 4px;text-align:center;border-right:1px solid #374151;background:#1F2937;color:#fff;vertical-align:middle}
.sch-date{font-size:13px;font-weight:700;line-height:1.2;display:block}
.sch-dow{font-size:11px;font-weight:400;opacity:.8;display:block;margin-top:2px}
/* FORM */
.fpage{height:100%;overflow-y:auto;background:#fff}
.fhrow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #f3f4f6}
.bbtn{font-size:13px;padding:4px 10px;border:1px solid #d1d5db;border-radius:6px;background:none;cursor:pointer;color:#6b7280}
.kjval{font-size:15px;font-weight:700;color:#B91C1C}
.frow{display:flex;align-items:center;gap:6px;padding:5px 12px;border-bottom:1px solid #f3f4f6}
.flab{font-size:11px;color:#6b7280;white-space:nowrap;min-width:28px}
.hpills{display:flex;gap:5px;overflow-x:auto}
.spisms{padding:4px 10px;border-radius:20px;font-size:12px;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#374151;font-weight:500;white-space:nowrap}
.spisms.act{background:#22C55E;color:#fff;border-color:#22C55E}
.gpsm{padding:4px 10px;border-radius:20px;font-size:12px;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#111827;font-weight:500;white-space:nowrap}
.gpsm.act{border-color:#3B82F6;background:#EFF6FF;color:#1E40AF}
.bpsm{padding:4px 10px;border-radius:20px;font-size:12px;border:1.5px solid #d1d5db;cursor:pointer;background:#fff;color:#374151;font-weight:500;white-space:nowrap}
.bpsm.act{background:#B91C1C;color:#fff;border-color:#B91C1C}
</style>
</head>
<body>
<div class="app-root" id="app"></div>
<script>
var BR=['川内校','鳴門校','藍住校','松茂校','石井校','北島校','南部校','勝瑞校'];
var SBJ=['数学','英語','国語','理科','社会','算数','物理','化学'];
var GRADES=['小','中1','中2','中3','高1','高2','高3'];
var DY=['日','月','火','水','木','金','土'];
var ACCOUNTS=[{id:1,name:'宮川 博',email:'miyakawa.hiroshi@gmail.com',color:'#3B82F6'},{id:2,name:'山下',email:'yamashita@gmail.com',color:'#10B981'}];
var cu=ACCOUNTS[0],wk=new Date();wk.setDate(wk.getDate()-wk.getDay());
var view='sch';
var fBrList=[],fDate=null,fSj=null,fGr=null,fStu='';
var S=[];

function fd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function wkd(){var r=[];for(var i=0;i<7;i++){var d=new Date(wk);d.setDate(d.getDate()+i);r.push(d)}return r}
function av(n){return n.replace(/\s/g,'').slice(0,2)}

window.oForm=function(br,dt){
  view='form';
  fBrList=[br];
  fDate=dt;
  fGr=null;
  fSj=SBJ[0];
  R();
};

window.gBack=function(){
  view='sch';
  R();
};

window.sBr=function(b){fBrList=[b];R();};
window.sSj=function(s){fSj=s;R();};
window.sGr=function(g){fGr=fGr===g?null:g;R();};

function rSch(){
  var dates=wkd();
  var schThd=dates.map(function(d){
    return '<th class="sch-th"><span class="sch-date">'+(d.getMonth()+1)+'/'+d.getDate()+'</span><span class="sch-dow">('+DY[d.getDay()]+')</span></th>';
  }).join('');
  var rows=BR.map(function(br){
    var cells=dates.map(function(d){
      var dt=fd(d);
      return '<td class="dyt"><div class="cin"><button class="adc" onclick="oForm(\''+br+'\',\''+dt+'\')">+</button></div></td>';
    }).join('');
    return '<tr><td class="brn">'+br+'</td>'+cells+'</tr>';
  }).join('');

  return '<div class="schp">'
    +'<div class="ahdr"><div class="atitle"><span>■</span> 個別指導スクエア</div>'
    +'<div class="uchip"><div class="uav" style="background:'+cu.color+'">'+av(cu.name)+'</div><span style="font-size:11px">'+cu.name+'</span></div></div>'
    +'<div class="schscr"><div class="gwrap"><table class="stbl"><tr><th style="width:70px">校舎</th>'+schThd+'</tr><tbody>'+rows+'</tbody></table></div></div></div>';
}

function rForm(){
  var bpills=BR.map(function(b){return'<button class="bpsm '+(fBrList.indexOf(b)>=0?'act':'')+'" onclick="sBr(\''+b+'\')">'+b+'</button>';}).join('');
  var gpills=GRADES.map(function(g){return'<button class="gpsm '+(fGr===g?'act':'')+'" onclick="sGr(\''+g+'\')">'+g+'</button>';}).join('');
  var spills=SBJ.map(function(s){return'<button class="spisms '+(fSj===s?'act':'')+'" onclick="sSj(\''+s+'\')">'+s+'</button>';}).join('');

  return '<div class="fpage">'
    +'<div class="fhrow"><button class="bbtn" onclick="gBack()">← 戻る</button><span class="kjval">'+fBrList.join('・')+' ('+fDate+')</span></div>'
    +'<div class="frow"><span class="flab">校舎</span><div class="hpills">'+bpills+'</div></div>'
    +'<div class="frow"><span class="flab">教科</span><div class="hpills">'+spills+'</div></div>'
    +'<div class="frow"><span class="flab">学年</span><div class="hpills">'+gpills+'</div></div>'
    +'</div>';
}

function R(){
  document.getElementById('app').innerHTML = view==='sch'?rSch():rForm();
}
R();
</script>
</body>
</html>
